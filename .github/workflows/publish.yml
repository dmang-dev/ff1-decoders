name: Publish to PyPI

# Runs when a GitHub release is published. PyPI trusted publishing (OIDC): no API token is
# stored anywhere; PyPI trusts this workflow in this repository, in the `pypi` environment.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$tag" ]; then echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; fi
      - run: python -m pip install --upgrade pip build twine pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The built wheel installs and its tests pass
        run: |
          python -m pip install "$(ls dist/*.whl)"
          # a copy outside the checkout, so the installed wheel is what gets imported
          cp -r tests "$RUNNER_TEMP/wheel-tests" && cd "$RUNNER_TEMP/wheel-tests"
          python -m pytest -q -p no:cacheprovider .
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ff1-decoders
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
