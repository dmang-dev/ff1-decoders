# Place names by map id (WRAM $48). The ROM has no place-name text; the names follow
# Andrew Church's map list of the NES version (achurch.org, ff1-maps.html), whose 61
# maps match the ROM's 61 standard maps; the revisited temple's B1-B4 element names are
# Nintendo Power's (vol. 17, pp. 75-76: "The Earth Floor", "The Fire Floor", "Floor Of
# Water", "Floor Of Wind"). The ROM's per-map tileset table (PRG $2CC0; WRAM $49 is the current map's
# tileset) fixes the blocks: 0-7 towns (tileset 0), 8-11 castles (1), 12 temple (5),
# 13-14 29-36 60 the Earth/Volcano set (2), 15-21 37-39 caves (3), 22-23 27-28 40-41
# Marsh/Mirage (4), 42-46 shrine (5), 47-51 sky (6), 52-59 the revisited temple (7).
# Floor numbers follow the stair warp table (PRG $2D00 x, $2D40 y, $2D80 map): the
# Sea Shrine's way in is 44, with stairs up to 45 and 46 (the top floor) and down to
# 43 and 42; the Floating Castle chains 47 -> 51; the revisited temple's way in, 52,
# leads to 53 -> 54 and to 55 -> 59.
