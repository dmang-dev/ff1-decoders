# Story flags, all in SRAM. A flag is an addr plus either bit (set = true; with
# clear = true the game clears the bit to mark the event) or equals (a whole-byte
# compare). sram $6200-$62FF is one byte per map object: bit 0 = the object is on its
# map, bit 1 = its event done (bit 2 is a treasure box's opened bit, so these always
# pick one bit). Read the live bytes: the save copy at 0x400+ is only written on save.
# Evidence: "play" = observed to change in play; "rom" = the ROM's only write to the
# byte is the one named.
[flags.garland_defeated]
addr = 0x202           # play: Garland's object disappears
region = "sram"
bit = 0
clear = true
verified = true

[flags.princess_rescued]
addr = 0x212           # play: she appears in Coneria Castle (0x203, her temple copy, clears)
region = "sram"
bit = 0
verified = true

[flags.bridge_built]
addr = 0x08            # play: set while the King's dialogue is still open; bridge at 152,152
region = "sram"
equals = 1
verified = true

[flags.ship_obtained]
addr = 0x00            # play: 0 -> 1; rom: the one INC $6000
region = "sram"
bit = 0
verified = true

[flags.canal_opened]
addr = 0x0C            # play: 1 -> 0 (the canal's blocker leaves); rom: the one STA $600C
region = "sram"
bit = 0
clear = true
verified = true

