[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ff1-decoders"
version = "0.1.0"
description = "Decoders for Final Fantasy (NES) ROM tables, RAM, saves and menu screens"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dmang" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["final fantasy", "nes", "rom", "romhacking", "decoder"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
render = ["Pillow>=9"]
test = ["pytest>=7", "Pillow>=9"]

[tool.setuptools]
packages = ["ff1_decoders"]

[tool.setuptools.package-data]
ff1_decoders = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "ff1_decoders"]
pythonpath = ["."]
addopts = "--doctest-modules"
